services:
  pos-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${POS_SERVER_IMAGE:-standarfood-pos-server:latest}
    container_name: standarfood-pos-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "${POS_SERVER_PORT:-4000}:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:4000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
